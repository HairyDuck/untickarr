name: Feature request
description: Suggest an idea for Untickarr
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Untickarr does not cover yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work in the UI or API?
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Download client, *arr apps, or screenshots (no secrets).
