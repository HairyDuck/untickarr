name: Bug report
description: Something is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, passwords, or Pushover tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running Untickarr
      options:
        - Docker Compose (GHCR image)
        - Docker Compose (local build)
        - Synology Container Manager
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, commit, or "latest"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact secrets. Paste health errors or run output.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Transmission version, labels used, *arr versions.
